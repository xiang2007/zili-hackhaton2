<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navi | HEAT DISTRIBUTION ANALYSIS SYSTEM</title>
  <!-- Google Fonts for sleek typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      background-color: #070a12;
      color: #e2e8f0;
      position: relative;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    .ambient-radial {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(224, 122, 95, 0.08) 0%, rgba(0, 242, 254, 0.04) 40%, rgba(7, 10, 18, 0) 70%);
      z-index: 2;
      pointer-events: none;
    }

    .system-header {
      width: 100%;
      max-width: 1200px;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(7, 10, 18, 0.6);
      backdrop-filter: blur(10px);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .brand-title .divider {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
      font-size: 1.2rem;
    }

    .brand-title .subtext {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #cbd5e1;
      font-weight: 500;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      font-size: 0.78rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff4b4b;
      box-shadow: 0 0 8px #ff4b4b;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      padding: 60px 20px;
      z-index: 10;
    }

    .login-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .thermometer-wrapper {
      position: absolute;
      top: -85px;
      z-index: 20;
      pointer-events: none;
      animation: thermoContainerShake 4s infinite ease-in-out;
    }

    .thermo-svg {
      width: 80px;
      height: 120px;
      overflow: visible;
    }

    .mercury-line {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: riseMercury 4s infinite ease-in-out;
    }

    .liquid-fill {
      animation: colorHeat 4s infinite ease-in-out;
    }

    .explosion-ring {
      transform-origin: 30px 20px;
      animation: explodeBurst 4s infinite ease-in-out;
    }

    @keyframes riseMercury {
      0% { stroke-dashoffset: 60; }
      70%, 82% { stroke-dashoffset: 0; }
      90%, 100% { stroke-dashoffset: 60; }
    }

    @keyframes colorHeat {
      0% { fill: #38bdf8; stroke: #38bdf8; }
      40% { fill: #f59e0b; stroke: #f59e0b; }
      70%, 82% { fill: #ef4444; stroke: #ef4444; }
      90%, 100% { fill: #38bdf8; stroke: #38bdf8; }
    }

    @keyframes thermoContainerShake {
      0%, 60% { transform: translate(0, 0) rotate(0deg); }
      65% { transform: translate(-2px, 0) rotate(-2deg); }
      70% { transform: translate(2px, 0) rotate(2deg); }
      75% { transform: translate(-3px, 0) rotate(-3deg); }
      80% { transform: translate(3px, 0) rotate(3deg); }
      83%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes explodeBurst {
      0%, 78% { opacity: 0; transform: scale(0.2); }
      80% { opacity: 1; transform: scale(1.4); }
      88% { opacity: 0; transform: scale(2.2); }
      100% { opacity: 0; transform: scale(0.2); }
    }

    .login-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(255, 255, 255, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      padding: 48px 36px 40px 36px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .login-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(224, 122, 95, 0.1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h2 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .input-group {
      margin-bottom: 22px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .input-group input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: #e07a5f;
      box-shadow: 0 0 18px rgba(224, 122, 95, 0.25);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    .signin-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #e07a5f 0%, #38bdf8 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(224, 122, 95, 0.25);
    }

    .signin-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(224, 122, 95, 0.35);
    }

    .signin-btn:active {
      transform: translateY(0);
    }

    .footer-credits {
      width: 100%;
      padding: 20px;
      text-align: center;
      font-size: 0.78rem;
      color: #64748b;
      z-index: 10;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(224, 122, 95, 0.6);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      font-size: 0.88rem;
      z-index: 100;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 640px) {
      .system-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
      .brand-title .subtext {
        display: none;
      }
      .login-card {
        padding: 36px 24px 30px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Grid & Glow Overlay -->
  <div class="bg-grid"></div>
  <div class="ambient-radial"></div>

  <header class="system-header">
    <div class="brand-title">
      <span class="logo">Navi</span>
      <span class="divider">|</span>
      <span class="subtext">HEAT DISTRIBUTION ANALYSIS SYSTEM</span>
    </div>
    <div class="header-badges">
      <div class="status-badge">
        <span>Operational view</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Klang Valley</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="login-wrapper">
      
      <!-- Animated Thermometer -->
      <div class="thermometer-wrapper">
        <svg class="thermo-svg" viewBox="0 0 60 120">
          <circle class="explosion-ring" cx="30" cy="20" r="15" fill="none" stroke="#ef4444" stroke-width="3" />
          <circle class="explosion-ring" cx="30" cy="20" r="22" fill="none" stroke="#f59e0b" stroke-width="2" />
          
          <rect x="22" y="15" width="16" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
          <circle cx="30" cy="90" r="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
          
          <line class="mercury-line liquid-fill" x1="30" y1="80" x2="30" y2="22" stroke-width="8" stroke-linecap="round"/>
          <circle class="liquid-fill" cx="30" cy="90" r="13" />
        </svg>
      </div>

      <!-- Glassmorphism Login Card -->
      <div class="login-card">
        <div class="login-header">
          <h2>Welcome Back</h2>
          <p>Sign in to access real-time municipal telemetry.</p>
        </div>

        <form id="loginForm">
          <div class="input-group">
            <label for="username">Username or Email</label>
            <div class="input-wrapper">
              <input type="text" id="username" placeholder="operator@navi.gov.my" required autocomplete="off">
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="••••••••" required>
              <button type="button" class="toggle-password" id="togglePassword" title="Toggle password visibility">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="signin-btn">Authenticate System Access</button>
        </form>
      </div>

    </div>
  </main>

  <footer class="footer-credits">
    Navi Municipal Decision Support Portal &copy; 2026. Controlled technical data view.
  </footer>

  <!-- Notification Toast -->
  <div class="toast-msg" id="toast">Authentication initialised...</div>

  <script>
    // Password Visibility Toggle
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePasswordBtn.style.color = isPassword ? '#e07a5f' : '#94a3b8';
    });

    // Toast Notification Handler
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // SHA-256 Hashing helper
    async function hashPassword(plainText) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plainText);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Form Submission Listener
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = passwordInput.value;
      const hashedPassword = await hashPassword(password);

      console.log('User identity:', username);
      console.log('Hashed credential token (SHA-256):', hashedPassword);
      
      showToast(`Access Granted: ${username} (Hash generated in console)`);
    });
  </script>
</body>
</html>
